name: E2E staging API

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Staging API base URL
        required: true
  schedule:
    # Optional weekly staging check — set STAGING_API_URL secret and enable
    - cron: "0 14 * * 1"

jobs:
  staging-api-e2e:
    if: github.event_name == 'workflow_dispatch' || vars.STAGING_API_URL != ''
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_url || vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build -w @virlux/shared

      - name: Register + login flow
        run: |
          EMAIL="e2e-$(date +%s)@staging.virlux.test"
          PASS="TestPass123!"
          REG=$(curl -fsS -X POST "$API_URL/api/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"fullName\":\"E2E Test\",\"companyName\":\"E2E Co\"}")
          echo "$REG" | jq -e '.accessToken'
          echo "$REG" | jq -e '.user.email == "'"$EMAIL"'"'

      - name: Public quote
        run: curl -fsS "$API_URL/api/quote/estimate?amountCad=1000&toCountry=US" | jq -e '.amountOut'
