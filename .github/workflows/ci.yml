name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virlux
          POSTGRES_PASSWORD: virlux
          POSTGRES_DB: virlux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://virlux:virlux@localhost:5432/virlux
      JWT_SECRET: ci-test-secret-min-32-characters-long
      TELEGRAM_MODE: polling
      TELEGRAM_BOT_TOKEN: ""
      AUTO_SETTLE: "false"
      SETTLEMENT_MODE: partner
      ALLOW_ORG_DEPOSIT_CONFIRM: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: CI guards
        run: bash scripts/ci-guards.sh

      - run: npm run build -w @virlux/shared

      - name: Prisma migrate
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate status 2>&1 | grep -qE 'Database schema is up to date|No pending migrations'

      - run: npm run build -w @virlux/api
      - run: npm run build -w @virlux/web
      - run: npm run build -w @virlux/app

      - name: Unit tests
        run: npm test

      - name: Seed for API E2E
        working-directory: apps/api
        env:
          NODE_ENV: development
          AUTO_SETTLE: "true"
        run: npx tsx prisma/seed.ts

      - name: Start API for shell E2E
        working-directory: apps/api
        env:
          NODE_ENV: development
          AUTO_SETTLE: "true"
        run: |
          npm run start &
          for i in $(seq 1 45); do
            curl -sf http://localhost:3002/health && break
            sleep 2
          done
          curl -sf http://localhost:3002/health

      - name: Shell E2E
        env:
          STAGING_API_URL: http://localhost:3002
          NODE_ENV: development
        run: |
          npm run staging:e2e
          npm run staging:partner-e2e
