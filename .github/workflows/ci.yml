name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virlux
          POSTGRES_PASSWORD: virlux
          POSTGRES_DB: virlux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://virlux:virlux@localhost:5432/virlux
      JWT_SECRET: ci-test-secret-min-32-characters-long
      TELEGRAM_MODE: polling
      TELEGRAM_BOT_TOKEN: ""
      AUTO_SETTLE: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build -w @virlux/shared

      - name: Prisma
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - run: npm run build -w @virlux/api
      - run: npm run build -w @virlux/web
      - run: npm run build -w @virlux/app

      - name: Tests
        run: npm test
