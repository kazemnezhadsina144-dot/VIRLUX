name: Playwright E2E

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_urls:
        description: "Run against live Vercel/custom URLs (requires repo vars PLAYWRIGHT_WEB_URL + PLAYWRIGHT_APP_URL)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virlux
          POSTGRES_PASSWORD: virlux
          POSTGRES_DB: virlux
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://virlux:virlux@localhost:5432/virlux
      DIRECT_URL: postgresql://virlux:virlux@localhost:5432/virlux
      JWT_SECRET: ci-test-secret-min-32-characters-long
      TELEGRAM_MODE: polling
      AUTO_SETTLE: "true"
      SETTLEMENT_MODE: sandbox
      DEMO_APPROVAL_THRESHOLD: "100"
      NODE_ENV: development
      # Live/staging: set repo Settings → Variables → PLAYWRIGHT_WEB_URL (e.g. https://virlux.com)
      # and PLAYWRIGHT_APP_URL (e.g. https://virlux-app.vercel.app), then workflow_dispatch live_urls=true
      PLAYWRIGHT_WEB_URL: ${{ vars.PLAYWRIGHT_WEB_URL || 'http://localhost:3100' }}
      PLAYWRIGHT_APP_URL: ${{ vars.PLAYWRIGHT_APP_URL || 'http://localhost:3001' }}
      E2E_DEMO_LOGIN: "1"
      DEMO_SEED_PASSWORD: "VirluxLocalDev!12"
      E2E_DEMO_PASSWORD: "VirluxLocalDev!12"
      AUTH_RATE_LIMIT_MAX: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: DB setup
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Build
        if: github.event.inputs.live_urls != 'true'
        run: npm run build

      - name: Start stack
        if: github.event.inputs.live_urls != 'true'
        run: |
          npm run dev:stack &
          STACK_PID=$!
          echo "STACK_PID=$STACK_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3002/health >/dev/null \
              && curl -sf http://localhost:3100/ >/dev/null \
              && curl -sf http://localhost:3001/ >/dev/null; then
              echo "Stack ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Stack failed to start — port listeners:"
          ss -tlnp || netstat -tlnp || true
          curl -v http://localhost:3002/health || true
          exit 1

      - name: Playwright (local stack)
        if: github.event.inputs.live_urls != 'true'
        run: npx playwright test

      - name: Playwright (live URLs)
        if: github.event.inputs.live_urls == 'true'
        run: |
          test -n "${{ vars.PLAYWRIGHT_WEB_URL }}" && test -n "${{ vars.PLAYWRIGHT_APP_URL }}" || \
            (echo "Set PLAYWRIGHT_WEB_URL and PLAYWRIGHT_APP_URL repo variables" && exit 1)
          npx playwright test

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
